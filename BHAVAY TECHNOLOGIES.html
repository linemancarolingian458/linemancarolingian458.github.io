<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>BHAVYA . TECHNOLOGIES - Learning Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e0b36, #0a192f);
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            color: #00FFAB;
            text-shadow: 0 0 10px rgba(0, 255, 171, 0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #8892b0;
            font-size: 1.1rem;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        .playlist {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .playlist h2 {
            color: #FFD700;
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
        }

        .video-btn {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .video-btn:hover {
            background: rgba(0, 255, 171, 0.1);
            border-color: #00FFAB;
            transform: translateX(5px);
        }

        .video-btn.active {
            background: rgba(0, 255, 171, 0.2);
            border-left: 5px solid #00FFAB;
            font-weight: bold;
        }

        .video-btn span {
            margin-right: 12px;
            font-size: 1.3rem;
        }

        .player-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-title {
            font-size: 1.6rem;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge {
            background: #00FFAB;
            color: #000;
            font-size: 0.85rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .code-box {
            margin-top: 20px;
            background: #0d1117;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #FFD700;
        }

        .code-box p {
            color: #8892b0;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        pre {
            color: #00FFAB;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            white-space: pre-wrap;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>BHAVYA . TECHNOLOGIES</h1>
        <p class="subtitle">Interactive Programming Course Portal</p>
    </div>

    <div class="dashboard">
        <div class="playlist">
            <h2>📚 Learning Modules</h2>
            <button class="video-btn active" id="btn-python" onclick="changeCourse('python')"><span>🐍</span> Basics of Python</button>
            <button class="video-btn" id="btn-html" onclick="changeCourse('html')"><span>🌐</span> Basics of HTML</button>
            <button class="video-btn" id="btn-java" onclick="changeCourse('java')"><span>☕</span> Basics of Java</button>
            <button class="video-btn" id="btn-js" onclick="changeCourse('js')"><span>🟨</span> Basics of JavaScript</button>
        </div>

        <div class="player-container">
            <div class="player-title">
                <span id="current-title">Basics of Python</span>
                <span class="status-badge">Stream Active</span>
            </div>
            
            <div class="video-wrapper">
                <iframe 
                    id="main-player" 
                    src="https://www.youtube.com/embed/_uQrJ0TkZlc?enablejsapi=1&rel=0" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="no-referrer-when-downgrade"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="code-box">
                <p>Related Code Snippet:</p>
                <pre id="code-display">print('Hello World from Python!')

# Python Variables
x = 10
y = "Bhavya Tech"
print(x, y)</pre>
            </div>
        </div>
    </div>

    <script>
        // Nayi Verfied Video IDs (Embedding Unlocked)
        const courses = {
            python: {
                title: "Basics of Python",
                videoId: "_uQrJ0TkZlc", // Programming with Mosh (Python)
                code: "print('Hello World from Python!')\n\n# Python Variables\nx = 10\ny = \"Bhavya Tech\"\nprint(x, y)"
            },
            html: {
                title: "Basics of HTML",
                videoId: "pQN-pnXPaVg", // FreeCodeCamp (HTML/CSS)
                code: "<!DOCTYPE html>\n<html>\n<head>\n  <title>HTML Basics</title>\n</head>\n<body>\n  <h1>Hello World from HTML!</h1>\n</body>\n</html>"
            },
            java: {
                title: "Basics of Java",
                videoId: "eIrMbAQSU34", // Programming with Mosh (Java)
                code: "public class Main {\n  public static void main(String[] args) {\n    System.out.println(\"Hello World from Java!\");\n  }\n}"
            },
            js: {
                title: "Basics of JavaScript",
                videoId: "W6NZfCO5SIk", // Programming with Mosh (JS)
                code: "console.log('Hello World from JavaScript!');\n\n// JavaScript Function\nfunction greet(name) {\n  return 'Welcome ' + name;\n}\nconsole.log(greet('Bhavya Tech'));"
            }
        };

        function changeCourse(key) {
            const data = courses[key];
            
            document.getElementById('current-title').innerText = data.title;
            document.getElementById('code-display').innerText = data.code;
            
            // Auto Update Iframe Source with Parameters
            document.getElementById('main-player').src = "https://www.youtube.com/embed/" + data.videoId + "?enablejsapi=1&rel=0";

            document.querySelectorAll('.video-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + key).classList.add('active');
        }
    </script>
</body>
</html>
