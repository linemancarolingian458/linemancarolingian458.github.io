name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A2AFE5: ${{ secrets.A2AFE5 }}
          BFA2E5: ${{ secrets.BFA2E5 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A2AFE5', '')
          k2 = os.environ.get('BFA2E5', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 4f6fd72164e93c3f287a2b059a55d9e8a45f -->', k1) if k1 else txt
          out = out.replace('<!-- 1fc336f805e27067248b05575a580d033864ae -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
